name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @palea/design-tokens build
      - run: pnpm validate
      - run: pnpm --filter @palea/mobile exec expo-doctor
      - run: pnpm --filter @palea/mobile export:all

  maestro:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Maestro requires an emulator-enabled runner; see apps/mobile/.maestro/README.md"
