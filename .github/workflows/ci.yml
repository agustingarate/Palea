name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_PALEA_ENV: development
      EXPO_PUBLIC_API_URL: http://localhost:3001
      EXPO_PUBLIC_PROJECTS_SOURCE: trpc
      EXPO_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
      EXPO_PUBLIC_AUTH_CALLBACK_URL: http://localhost:8081/auth/callback
      EXPO_PUBLIC_AUTH_PROVIDERS: email,google,linkedin_oidc
      NEXT_PUBLIC_PALEA_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3001
      PALEA_ENV: development
      PORT: 3001
      CORS_ORIGINS: http://localhost:3000,http://localhost:8081
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @palea/design-tokens build
      - run: pnpm validate
      - run: pnpm --filter @palea/mobile exec expo-doctor
      - run: pnpm --filter @palea/mobile export:all

  web-e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e:web
        env:
          PALEA_E2E_BASE_URL: ${{ secrets.PALEA_STAGING_WEB_URL }}

  maestro:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Maestro requires an emulator-enabled runner; see apps/mobile/.maestro/README.md"
